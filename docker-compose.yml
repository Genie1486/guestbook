version: '3.8'

services:
  app:
    image: guestbook:1.0
    container_name: guestbook-app
    ports:
      - "${HOST_PORT}:${PORT}"   # ← .env 값 참조
    volumes:
      - guestbook-data:/app/data
    environment:
      MODE: ${MODE}              # ← .env 값 참조
      DEBUG: ${DEBUG}
      PORT: ${PORT}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  guestbook-data: