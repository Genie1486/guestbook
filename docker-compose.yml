version: '3.8'

services:
  app:
    build: .
    image: guestbook:1.0
    container_name: guestbook-app
    ports:
      - "${HOST_PORT}:${PORT}"   # ← .env 값 참조
    volumes:
      - guestbook-data:/app/data
    environment:
      MODE: ${MODE}              # ← .env 값 참조
      DEBUG: ${DEBUG}
      PORT: ${PORT}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis          # ← redis 먼저 실행되어야 함

  redis:
    image: redis:7-alpine     # ← 빌드 없이 이미지 그대로 사용
    container_name: guestbook-redis   # ← 이거 추가!
    ports:
      - "6379:6379"

volumes:
  guestbook-data: